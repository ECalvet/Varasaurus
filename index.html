<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Paleo Earth</title>
    <link rel="stylesheet" href="style.css">

    <!-- Three.js nécessaire pour Globe.gl -->
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

    <!-- Globe.gl en UMD global -->
    <script src="https://unpkg.com/globe.gl"></script>

</head>
<body>

    <div id="ui" style="position:absolute; top:10px; left:10px; z-index:10;">
        <label>Age (Ma)</label> 
        <input type="range" id="timeSlider" min="0" max="200" step="1" value="0">
        <span id="timeLabel">0 Ma</span>
    </div>

    <div id="globe" style="width:100%; height:100vh;"></div>

    <!-- ton code JS en module -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
