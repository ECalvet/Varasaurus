<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Simplifier continents</title>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
</head>
<body>

<h2>Simplifier continents.geojson</h2>

<input type="file" id="geojsonFile">
<button onclick="simplify()">Simplifier et télécharger</button>

<script>
let geojsonData

document.getElementById("geojsonFile").onchange = async e => {
    geojsonData = JSON.parse(await e.target.files[0].text())
}

function simplify() {
    if(!geojsonData) return alert("Chargez un fichier GeoJSON d'abord!")

    // simplification avec tolerance 0.1° (~2x moins de points)
    const simplified = turf.simplify(geojsonData, {
        tolerance: 0.1, 
        highQuality: true
    })

    const blob = new Blob([JSON.stringify(simplified)], {type:"application/json"})
    const url = URL.createObjectURL(blob)

    const a = document.createElement("a")
    a.href = url
    a.download = "continents_simplified.geojson"
    a.click()
}
</script>

</body>
</html>
